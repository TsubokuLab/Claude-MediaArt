    <script type="text/javascript">
      // 末尾スラッシュの追加
      (function() {
        var location = window.location;
        var pathname = location.pathname;
        var isGitHubPages = location.hostname === 'tsubokulab.github.io';
        
        // GitHub Pagesで末尾にスラッシュがない場合は追加する
        if (isGitHubPages && pathname.indexOf('/Claude-MediaArt') === 0 && pathname !== '/Claude-MediaArt/') {
          // クエリパラメータやハッシュを保持してリダイレクト
          window.location.replace(location.protocol + '//' + location.host + pathname + '/' + location.search + location.hash);
        }
        
        // リダイレクト元からのリクエストか確認
        if (window.location.search.indexOf('?/') !== -1) {
          var redirectParts = window.location.search.substring(2).split('&');
          var pathname = redirectParts[0].replace(/~and~/g, '&');
          var search = redirectParts.length > 1 ? '?' + redirectParts[1].replace(/~and~/g, '&') : '';
          var hash = window.location.hash;
          window.history.replaceState(null, null, pathname + search + hash);
        }
      })();
    </script>
